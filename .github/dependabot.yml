version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # Type definitions must match the supported runtime and VS Code engine
      # minimums. Bump @types/vscode deliberately together with engines.vscode.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
      # Blocked until typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # Isolated Marketplace publishing tool. Keep @vscode/vsce at the same version
  # as the root devDependency; merge both update PRs together.
  - package-ecosystem: npm
    directory: /tools/publish
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
