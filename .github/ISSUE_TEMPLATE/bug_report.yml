name: Bug report
description: Report a reproducible RepoShelf problem using sanitized data
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities here; use private vulnerability reporting.
        Never include credentials, private source, internal URLs, organization or
        project identities, usernames, absolute personnel paths, or marker data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
      placeholder: Use example.test and synthetic project data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoShelf version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: VS Code and operating environment
      placeholder: VS Code 1.x; Windows, Linux, macOS, WSL, or remote host
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed all credentials and private environment identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
