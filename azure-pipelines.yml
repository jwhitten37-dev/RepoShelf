trigger:
  branches:
    include:
      - main
  tags:
    include:
      - "v*"

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: "24.21.0"
  vsixArtifactName: "reposhelf-vsix"

stages:
  - stage: Validate
    displayName: Validate and package
    jobs:
      - job: Build
        displayName: Build validated VSIX
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 20
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install locked dependencies

          - script: npm run check
            displayName: Run formatting, lint, type checking, and tests

          - script: npm run compile
            displayName: Build extension bundle

          - script: npm audit --audit-level=high
            displayName: Audit production and development dependencies

          - bash: |
              set -euo pipefail

              package_version=`node -p "require('./package.json').version"`
              if [[ "$BUILD_SOURCEBRANCH" == refs/tags/* ]]; then
                expected_tag="v${package_version}"
                actual_tag="${BUILD_SOURCEBRANCH#refs/tags/}"

                if [[ "$actual_tag" != "$expected_tag" ]]; then
                  echo "Release tag $actual_tag does not match package version $package_version." >&2
                  exit 1
                fi

                git fetch origin main:refs/remotes/origin/main --no-tags
                if ! git merge-base --is-ancestor "$BUILD_SOURCEVERSION" origin/main; then
                  echo "Release tag must identify a commit contained in origin/main." >&2
                  exit 1
                fi
              fi

              npm run package:vsix -- --out-dir "$(Build.ArtifactStagingDirectory)"
            displayName: Package and inspect VSIX

          - task: PublishPipelineArtifact@1
            displayName: Retain validated VSIX
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: $(vsixArtifactName)
              publishLocation: pipeline

  - stage: Publish
    displayName: Publish to Visual Studio Marketplace
    dependsOn: Validate
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: Marketplace
        displayName: Publish validated VSIX
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 15
        environment: reposhelf-marketplace
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - checkout: self

                - task: NodeTool@0
                  displayName: Use Node.js $(nodeVersion)
                  inputs:
                    versionSpec: $(nodeVersion)

                - script: npm ci
                  displayName: Install locked publishing tool

                - task: DownloadPipelineArtifact@2
                  displayName: Download validated VSIX
                  inputs:
                    artifact: $(vsixArtifactName)
                    path: $(Pipeline.Workspace)/$(vsixArtifactName)

                - task: AzureCLI@2
                  displayName: Publish with Microsoft Entra ID
                  inputs:
                    azureSubscription: Azure
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      mapfile -t vsix_files < <(find "$(Pipeline.Workspace)/$(vsixArtifactName)" -maxdepth 1 -type f -name '*.vsix' -print)
                      mapfile -t evidence_files < <(find "$(Pipeline.Workspace)/$(vsixArtifactName)" -maxdepth 1 -type f -name '*.evidence.json' -print)
                      if [[ "${#vsix_files[@]}" -ne 1 ]]; then
                        echo "Expected exactly one validated VSIX artifact; found ${#vsix_files[@]}." >&2
                        exit 1
                      fi
                      if [[ "${#evidence_files[@]}" -ne 1 ]]; then
                        echo "Expected exactly one package evidence file; found ${#evidence_files[@]}." >&2
                        exit 1
                      fi

                      VSIX_PATH="${vsix_files[0]}" EVIDENCE_PATH="${evidence_files[0]}" node <<'NODE'
                      const { createHash } = require("node:crypto");
                      const { readFileSync } = require("node:fs");
                      const vsix = readFileSync(process.env.VSIX_PATH);
                      const evidence = JSON.parse(readFileSync(process.env.EVIDENCE_PATH, "utf8"));
                      const actual = createHash("sha256").update(vsix).digest("hex");
                      if (evidence.extensionId !== "chiefwizard.reposhelf" || evidence.vsix.sha256 !== actual) {
                        throw new Error("Downloaded VSIX does not match its validated identity and SHA-256 evidence.");
                      }
                      NODE

                      npm exec -- vsce verify-pat chiefwizard --azure-credential

                      npm exec -- vsce publish \
                        --packagePath "${vsix_files[0]}" \
                        --azure-credential \
                        --pre-release

  # Temporary diagnostic: remove after the Marketplace publisher member is
  # confirmed against the federated identity's Azure DevOps profile ID.
  - stage: DiagnoseMarketplaceIdentity
    displayName: Diagnose Marketplace identity
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: QueryProfile
        displayName: Query federated identity profile
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 10
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: Install locked publishing tool

          - task: AzureCLI@2
            displayName: Query Marketplace identity and publisher access
            inputs:
              azureSubscription: Azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az rest \
                  --method get \
                  --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me" \
                  --resource "499b84ac-1321-427f-aa17-267ca6975798" \
                  --output json | node -e '
                    let input = "";
                    process.stdin.setEncoding("utf8");
                    process.stdin.on("data", (chunk) => { input += chunk; });
                    process.stdin.on("end", () => {
                      const profile = JSON.parse(input);
                      if (typeof profile.id !== "string" || profile.id.length === 0) {
                        throw new Error("Azure DevOps profile ID is missing.");
                      }
                      if (typeof profile.displayName !== "string" || profile.displayName.length === 0) {
                        throw new Error("Azure DevOps profile display name is missing.");
                      }
                      console.log(`Marketplace profile display name: ${profile.displayName}`);
                      console.log(`Marketplace profile ID: ${profile.id}`);
                    });
                  '

                npm exec -- vsce verify-pat chiefwizard --azure-credential
